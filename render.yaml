# render.yaml — Render Blueprint
# Connect your GitHub repo to Render and it will create all 3 services automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── 1. ML API (Python FastAPI) ──────────────────────────────────────────────
  - type: web
    name: ambucast-ml-api
    runtime: python
    rootDir: ml_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        # Set this AFTER deploying the frontend — use the Render static site URL
        # Example: https://ambucast-frontend.onrender.com
        value: ""

  # ─── 2. Backend (Node.js Express) ────────────────────────────────────────────
  - type: web
    name: ambucast-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Paste your Neon.tech connection string here (or set manually in Render dashboard)
        # Get it from: https://neon.tech → your project → Connection Details → copy the URL
        sync: false
      - key: ML_API_URL
        # Fill in after deploying ambucast-ml-api above — copy its URL from Render dashboard
        # Example: https://ambucast-ml-api.onrender.com
        sync: false
      - key: ML_API_ENABLED
        value: "true"
      - key: ML_API_TIMEOUT
        value: "30000"
      - key: OPENWEATHER_API_KEY
        # Your OpenWeather API key
        sync: false
      - key: CORS_ORIGIN
        # Fill in after deploying ambucast-frontend below — copy its URL from Render dashboard
        # Example: https://ambucast-frontend.onrender.com
        sync: false

  # ─── 3. Frontend (React / Vite Static Site) ──────────────────────────────────
  - type: web
    name: ambucast-frontend
    runtime: static
    rootDir: new-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        # Fill in after deploying ambucast-backend above
        # Example: https://ambucast-backend.onrender.com/api
        sync: false
      - key: VITE_ML_API_URL
        # Fill in after deploying ambucast-ml-api above
        # Example: https://ambucast-ml-api.onrender.com
        sync: false
      - key: VITE_SOCKET_URL
        # Same as backend URL but without /api
        # Example: https://ambucast-backend.onrender.com
        sync: false
      - key: VITE_MAP_CENTER_LAT
        value: "28.6139"
      - key: VITE_MAP_CENTER_LNG
        value: "77.2090"
      - key: VITE_MAP_ZOOM
        value: "12"
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
